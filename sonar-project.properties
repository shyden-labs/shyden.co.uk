# SonarCloud scanner settings, read by every scan: ci.yml's pull request scan
# and deploy-dev.yml's develop branch scan (#1281), so the two cannot drift.
#
# Coverage is measured over what vitest.config.ts measures; the .astro pages,
# styles and config files are the e2e suite's, so they are left out of the
# coverage figure here too. The copy tables are parallel by design (every
# locale has the same keys, only the text differs), so duplication is not
# measured there (Shyden's ruling, 2026-11-20, #1032), nor in the privacy
# text, whose Indonesian copy has the English one's shape line for line (his
# ruling, 2026-11-22, #1082); every other file keeps the gate's limit.
sonar.host.url=https://sonarcloud.io
sonar.organization=shyden-labs
sonar.projectKey=shyden-labs_shyden.co.uk
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,docs/**
sonar.cpd.exclusions=src/lib/i18n/en.ts,src/lib/i18n/id.ts,src/lib/i18n/zh.ts,src/lib/i18n/vi.ts,src/lib/i18n/th.ts,src/lib/i18n/site.ts,src/lib/legal/privacy.ts
sonar.coverage.exclusions=scripts/test-devices.mjs,**/*.astro,**/*.css,*.config.ts,*.config.mjs,playwright.*.ts,docker/**,public/**
