name: Deploy to prod (on merge to main, approval-gated)
# PROD DEPLOYS FROM MAIN, AFTER THE MERGE. Fires on every push to `main` and
# waits at the `prod` Environment approval gate, so nothing reaches
# shyden.co.uk without a deliberate approval — and whatever is live is always a
# commit that is on `main`.
#
# This replaced a deploy-BEFORE-merge pipeline. That one made production the
# gate: a mistake first became real in front of teachers, and for the length of
# a release `main` did not describe what was live. The merge gate is now
# `dev-verified` (deploy-dev.yml).
#
# `workflow_dispatch` is kept for the case main is already correct and prod
# needs re-deploying — a rollback that is forward rather than backward, and the
# only way to re-run this without an empty commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One lock around everything that changes what prod serves, shared with
# rollback.yml (#238). A deploy never cancels a run in it: pushed during a
# rollback, it waits for the rollback, then stops at the approval as usual. A
# rollback, in turn, cancels a deploy that holds the lock (see rollback.yml).
concurrency:
  group: shyden-prod-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-prod:
    name: Deploy to Prod (needs approval)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: prod
      url: https://shyden.co.uk
    # What production served before this release, for rollback-prod (#748).
    outputs:
      before: ${{ steps.live.outputs.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # What production serves now, read before anything changes it (#748):
      # the deployment rollback-prod returns to if this release fails its
      # live check. Assigned, never inlined into the echo: `bash -e` stops on
      # a failed assignment, but not on a failed `$(...)` inside an argument.
      # A failed read stops the release, with nothing to fall back to.
      - name: Read the live deployment
        id: live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          before="$(node scripts/pages.mjs live shyden-site)"
          echo "before=${before}" >> "$GITHUB_OUTPUT"
          echo "Live before this deploy: ${before}"
      - run: npm ci
      - name: Build (prod defaults — outbound ShyTalk and Yawelo Idle links → PROD)
        run: npm run build
      - name: Guard — fail if a [[placeholder]] leaked into shipped text
        # -I: skip binary files. woff/woff2 fonts contain the bytes `[[`; a
        # placeholder leak is a TEXT concern, so scanning binaries false-fails.
        #
        # Matches the placeholder SHAPE — `[[` … `]]` with no `]` between —
        # rather than a bare `[[`. A bare `[[` is ordinary JavaScript: the
        # minified bundle contains `new Map([[k,v],[k,v]])`, which blocked a
        # release on 2026-08-05 with nothing wrong with the site. This is the
        # second false positive of the same kind (see the `-I` note above), and
        # both had the same cause — matching a fragment instead of the thing.
        #
        # It stays safe against that syntax because `[^]]` cannot cross the
        # first `]`, so `[[k,v],` never completes the pattern. Verified against
        # a real build: 0 matches, while an injected `[[companyNo]]` and an
        # injected `[[reg office]]` are both caught.
        run: |
          if grep -rnIE '\[\[[^]]{1,60}\]\]' dist/; then
            echo "::error::A [[…]] placeholder reached dist/ — refusing to ship to prod."
            exit 1
          fi
          echo "No bracket placeholders in dist/ (text)."
      - name: Deploy dist/ to Cloudflare Pages (prod project)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name shyden-site --branch main

  # ---- Post-prod smoke + prod-verified -----------------------------------
  # Smokes the PUBLIC production domain — the host real visitors get.
  #
  # This used to smoke the `shyden-site.pages.dev` deployment alias, which was
  # cutover-independent and so worked before the apex DNS pointed at the
  # project. The cutover has happened, and the alias is the wrong target now:
  # it answers only behind Basic auth, so a DNS, certificate, or routing fault
  # on the apex left the site dark for every visitor while this job went green.
  #
  # `prod-verified` is no longer what branch protection requires (that is
  # `dev-verified` now, posted before the merge). It is kept because it is a
  # per-commit RECORD of what actually reached production and passed a smoke —
  # visible on the commit, queryable by the API, and the thing to look at when
  # asking "was this SHA ever live?".
  smoke-and-verify:
    name: Post-prod smoke + prod-verified
    needs: deploy-prod
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      # ---- Gate: the smoke and a real browser, before the status ----------
      #
      # One Playwright run holds both. tests/prod/prod-smoke.spec.ts is the
      # smoke, requested without a browser: every page answers, an unknown
      # path gets the not-found page, and certain strings are among the
      # bytes. That cannot prove a page RENDERS, and
      # this repo shipped a bug for an entire release that no text assertion
      # could see: `display: flex` ate authored whitespace while `textContent`
      # still contained it. prod-sanity.spec.ts asserts what only rendering
      # can: the stylesheet, the calculators' script, no sideways scroll.
      #
      # The smoke was a step of its own here until #390, where a fact in it
      # went stale with nothing before a release able to see it. As a spec,
      # each pull request's `sanity-on-build` runs it against that PR's own
      # prod build. The public apex is not behind Basic auth, so nothing here
      # sends a credential (#241).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke and verify the live prod site
        env:
          WEB_BASE_URL: https://shyden.co.uk
        run: npx playwright test --config=playwright.prod.config.ts

      # Reached only if BOTH the smoke and the browser run passed: a failing
      # step fails the job, so `prod-verified` is never posted for a release
      # that did not render.
      - name: Post prod-verified status on the released commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context=prod-verified \
            -f "description=Prod deployed + browser-verified (run ${{ github.run_id }})" \
            -f "target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Posted prod-verified=success on ${{ github.sha }}"

  # ---- A release that fails its live check is rolled back (#748) ------
  # Only when THIS run deployed (deploy-prod succeeded) and its check failed:
  # a bare failure() is also true after a refused approval or a failed
  # build, which changed nothing live. !cancelled(): a manual rollback.yml
  # cancels this run, and this job then stays out of its way. It runs in
  # `prod-rollback`, behind the operator's approval (#748 ruling 2026-10-14),
  # holds the prod Pages token, and runs no npm package code: never a step
  # of smoke-and-verify, which runs npm ci and Playwright.
  rollback-prod:
    name: Roll prod back to the deployment before this release
    needs: [deploy-prod, smoke-and-verify]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.deploy-prod.result == 'success' &&
      needs.smoke-and-verify.result == 'failure'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment:
      name: prod-rollback
      url: https://shyden.co.uk
    steps:
      # Present or absent, never the value, as rollback.yml checks them: a
      # secret removed from prod-rollback is named here, not met by curl.
      - name: Check the secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -n "${!name:-}" ]; then
              echo "${name}: present"
            else
              echo "::error::${name}: absent. It belongs in the prod-rollback environment."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Roll back to the deployment before this deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BEFORE: ${{ needs.deploy-prod.outputs.before }}
        run: node scripts/pages.mjs rollback shyden-site "${BEFORE}"

  # ---- Every failed release reaches the operator (#748) -----------------
  # As deploy-dev.yml's report-failure (#725): an aggregate, `if: always()`,
  # handed its needs' results; the script sends nothing unless one failed on
  # main. It does not need rollback-prod: that job waits for the operator's
  # approval, and the notice is how he learns there is one to give. No
  # environment: it reads its own token alone. No npm package code.
  report-failure:
    name: Report a failed release
    needs: [deploy-prod, smoke-and-verify]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Open or comment on the failed-release issue, if a job failed
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
          PIPELINE: prod
          REPORT: failure
        run: node scripts/deploy-failure.mjs

  # ---- The rollback's outcome reaches the same issue (#748) -------------
  # Once rollback-prod has run or been refused. An aggregate too: the script
  # sends nothing unless a rollback was queued, and otherwise comments the
  # outcome on the open notice.
  report-rollback:
    name: Report the rollback's outcome
    needs: [deploy-prod, rollback-prod]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Add the rollback's outcome to the failed-release issue
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
          PIPELINE: prod
          REPORT: rollback
        run: node scripts/deploy-failure.mjs
