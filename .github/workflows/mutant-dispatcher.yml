name: mutant-dispatcher
on:
  schedule:
    - cron: '0 3 * * *'
permissions: {}
jobs:
  dispatch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Start the mutant on main
        run: gh workflow run mutant-dispatcher.yml --ref main
