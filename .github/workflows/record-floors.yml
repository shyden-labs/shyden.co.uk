name: record-floors

# Records the guards' liveness floors on a scratch ref and hands them back as
# an artifact (#651; pushes nothing since #889).
#
# Why this exists: a floor measured on the laptop ties up the laptop for
# hours, and a Playwright figure measured there is measured on the wrong
# architecture. The gate (`ci.yml`) still never records; it judges
# `tests/floors.json` by equality, as it always did. This workflow is the one
# place a record runs in CI, and it runs only when somebody dispatches it.
#
# A CI bot never pushes to a branch (operator, 2026-10-21, every project), so
# the record is made on a commit the session has NOT pushed yet:
#
#   git push origin HEAD:refs/floors/<branch>
#   gh workflow run record-floors.yml --ref develop -f ref=refs/floors/<branch>
#   (wait for the run)
#   node scripts/fold-record.mjs <run-id>
#   git push origin <branch>
#   git push origin --delete refs/floors/<branch>
#
# A ref under `refs/floors/` is not a branch: it lists nowhere and starts no
# push, pull request or deploy run. The run measures it and uploads what
# moved; `scripts/fold-record.mjs` folds that into the local commit it
# measured (unpushed, so no force-push) and refuses a pushed HEAD, another
# commit and a dirty tree. The branch is then pushed once, normally, and its
# pull request runs its own checks: nothing is held for approval, since no
# workflow token pushed the head.
#
# `workflow_dispatch` ONLY, so no push or pull request can start a run that
# rewrites the figure it is checked against. It is dispatched from the default
# branch (GitHub runs only a workflow that exists there) and names the scratch
# ref in an input; any ref outside `refs/floors/` is refused before anything is
# checked out, `develop` and `main` included.
#
# Two jobs, and neither can write: the workflow's token is nothing, and each
# job reads the repository and no more.
#
#   image   picks the pinned Playwright image, as ci.yml's `image` job does.
#   record  runs the recorder inside that image (FLOORS_RECORD_IN_IMAGE=1, so
#           it runs Playwright directly instead of through `docker run`), then
#           uploads the new tests/floors.json, the commit message with the
#           moves added, the measured SHA and the ref, as the `floors-record`
#           artifact, only when a floor moved. The recorder's own refusals
#           (a fall, an unasserted or double-asserted id, a failed run) fail
#           this job, with their text in the job summary.
#
# `tests/guards/pipeline-wiring.test.ts` pins all of this.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: The scratch ref to record on, under refs/floors/ (never a branch)
        required: true
        type: string
      mode:
        description: full records every floor; unit and functions record their suites alone
        required: true
        default: full
        type: choice
        options:
          - full
          - unit
          - functions

# One record per scratch ref at a time, queued and never cancelled, so two
# records of one commit never upload beside each other.
concurrency:
  group: record-floors-${{ inputs.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - name: Refuse anything but a scratch ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          case "$REF" in
            refs/floors/?*) ;;
            *)
              echo "::error::floors are recorded on a scratch ref under refs/floors/, never on $REF: push the unpushed commit there first"
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - id: pick
        run: node scripts/playwright-image.mjs

  record:
    needs: image
    runs-on: ubuntu-26.04
    # The recorder runs the unit, guards and integration suites, the Playwright
    # specs on every project, and the Functions suite. Measured 2026-10-12
    # (#663): this job took 31.2 to 46.9 minutes on all ten full records that
    # had succeeded (longest: run 38088077407), and 1.5 to 3.4 in the unit and
    # functions modes. 60 is the longest full record and a quarter more; a
    # record that needs longer has grown, which is a finding, not a reason to
    # raise this.
    timeout-minutes: 60
    permissions:
      contents: read
    # The same pinned image and options as ci.yml's e2e shards, so a figure
    # measured here is the figure the gate reads.
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # The commit the record is made on, handed back with the figures, so
      # `scripts/fold-record.mjs` folds them into that commit and no other.
      - run: git rev-parse HEAD > "$RUNNER_TEMP/sha.txt"
      - uses: stefanzweifel/git-auto-commit-action@0000000000000000000000000000000000000000 # placeholder pin, a planted mutant
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cp tests/floors.json "$RUNNER_TEMP/floors-before.json"
      - name: Record the floors
        shell: bash
        env:
          FLOORS_RECORD_IN_IMAGE: '1'
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            full) flag='' ;;
            unit) flag='--unit' ;;
            functions) flag='--functions' ;;
            *) echo "::error::unknown mode $MODE"; exit 1 ;;
          esac
          npm run floors:record -- $flag 2>&1 | tee "$RUNNER_TEMP/record.log"
      - name: Put the recorder's refusal in the summary
        if: failure()
        run: |
          {
            echo '### The recorder refused or failed'
            echo
            echo '```'
            tail -n 60 "$RUNNER_TEMP/record.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The amended message is composed here, from the measured commit's own,
      # and `scripts/fold-record.mjs` amends with it unchanged.
      - id: diff
        env:
          MODE: ${{ inputs.mode }}
        run: |
          git log -1 --format=%B > "$RUNNER_TEMP/head-message.txt"
          node scripts/floors-diff.mjs "$RUNNER_TEMP/floors-before.json" tests/floors.json "$MODE" "$RUNNER_TEMP/head-message.txt" "$RUNNER_TEMP/message.txt"
      - name: Keep the figures for the session to fold
        if: steps.diff.outputs.changed == 'true'
        env:
          REF: ${{ inputs.ref }}
        run: |
          mkdir floors-record
          cp tests/floors.json floors-record/floors.json
          cp "$RUNNER_TEMP/message.txt" floors-record/message.txt
          cp "$RUNNER_TEMP/sha.txt" floors-record/sha.txt
          printf '%s\n' "$REF" > floors-record/ref.txt
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: floors-record
          path: floors-record
          retention-days: 7
          if-no-files-found: error
