name: CI

# PROBE, never merged (#929): every CI job's `npm ci` has taken 301-303 s
# since about 02:30Z on 2026-10-22 (5 s before), the length of npm's default
# fetch-timeout. Which request waits? Each install logs every request with
# its time (`--loglevel http`), with and without the audit, in the jobs'
# own container and on a plain runner.
on:
  workflow_dispatch:

permissions: {}

jobs:
  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: pick
        run: node scripts/playwright-image.mjs

  container:
    needs: image
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: The registry and the audit endpoint, timed
        run: |
          curl -sS -o /dev/null -w 'registry root: %{http_code} in %{time_total}s\n' https://registry.npmjs.org/ || true
          curl -sS -o /dev/null -w 'audit bulk: %{http_code} in %{time_total}s\n' -X POST -H 'content-type: application/json' -d '{}' https://registry.npmjs.org/-/npm/v1/security/advisories/bulk --max-time 320 || true
      - name: npm ci without the audit, every request timed
        shell: bash
        run: |
          set +e
          start=$(date +%s)
          npm ci --no-audit --no-fund --loglevel http > npm.log 2>&1; rc=$?
          echo "rc=$rc in $(( $(date +%s) - start ))s"
          grep -vE ' \(cache (hit|revalidated|updated)\)$' npm.log | tail -40
      - name: npm ci with the audit, every request timed
        shell: bash
        run: |
          set +e
          rm -rf node_modules
          start=$(date +%s)
          npm ci --no-fund --loglevel http > npm.log 2>&1; rc=$?
          echo "rc=$rc in $(( $(date +%s) - start ))s"
          grep -vE ' \(cache (hit|revalidated|updated)\)$' npm.log | tail -40

  host:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm ci with the audit, every request timed
        shell: bash
        run: |
          set +e
          start=$(date +%s)
          npm ci --no-fund --loglevel http > npm.log 2>&1; rc=$?
          echo "rc=$rc in $(( $(date +%s) - start ))s"
          grep -vE ' \(cache (hit|revalidated|updated)\)$' npm.log | tail -40
