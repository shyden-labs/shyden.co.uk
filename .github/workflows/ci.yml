# PROBE for #906, never merged: the WebKit frame test, 60 times, on this tree.
name: CI
on:
  workflow_dispatch:
permissions: {}
jobs:
  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - id: pick
        run: node scripts/playwright-image.mjs
  probe:
    needs: image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: The frame test with sound off on webkit, 150 times
        env:
          PROBE_SOUND_OFF: '1'
        run: npx playwright test --project=webkit tests/e2e/classroom-groups-board-travel.spec.ts -g "every student is seen exactly once" --repeat-each=150 --reporter=line
      - name: The frame test with sound on on webkit, 150 times
        if: always()
        run: npx playwright test --project=webkit tests/e2e/classroom-groups-board-travel.spec.ts -g "every student is seen exactly once" --repeat-each=150 --reporter=line
