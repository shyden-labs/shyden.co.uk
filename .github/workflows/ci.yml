# PROBE for #919, never merged: the WebKit frame test, 300 times, on PR #919's
# tree, with NO GStreamer variable in the job: the sink reaches WebKit only
# through engineUse's launchOptions.env, the route the PR ships.
name: CI
on:
  workflow_dispatch:
permissions: {}
jobs:
  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: pick
        run: node scripts/playwright-image.mjs
  probe:
    needs: image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: The job sets no GStreamer rank
        run: test -z "${GST_PLUGIN_FEATURE_RANK:-}"
      - name: The frame test with sound on, the sink set by engineUse only, on webkit, 300 times
        run: npx playwright test --project=webkit tests/e2e/classroom-groups-board-travel.spec.ts -g "every student is seen exactly once" --repeat-each=300 --reporter=line
