name: CI
# The REQUIRED status check on BOTH long-lived branches: `develop`, where work
# integrates, and `main`, which describes what is live.
#
# PR-only on purpose: a push to develop runs no suite. deploy-dev.yml proves
# the merged tree is the very tree this workflow passed on its PR, reading these
# checks off the PR head (scripts/deploy-gate.mjs), and deploy-prod.yml gates
# the push to main -- so a push: trigger here would only run the suite again on
# a tree that has already passed it (#157).
#
# NO base filter, deliberately. The bases were once named here to record which
# ones are REQUIRED — but that is a fact about branch protection, not something
# a trigger can express, and encoding it here bought documentation at the cost
# of coverage: a PR into any other base matched nothing, ran ZERO checks, and
# still reported `mergeStateStatus: CLEAN`. An empty check list is
# indistinguishable at a glance from "CI ran and passed" (#144, measured on
# PR #143 stacked on `17-aurora`).
#
# Widening costs nothing on the merge path: a PR into develop or main already
# ran exactly one run, and a stacked PR had none to add to. Which checks BLOCK
# a merge still lives where it belongs, in `required_status_checks.contexts`,
# and `tests/unit/pipeline-wiring.test.ts` pins the job name that list matches.
#
# `pull_request`, never `pull_request_target`: a fork PR must not see secrets.
#
# `workflow_call` is the one other trigger, and it is not a push: it is how
# deploy-dev.yml's dispatch path runs THIS suite on a branch that has no pull
# request, rather than a copy of it that could drift (#163).
on:
  pull_request:
  workflow_call:
# One run per pull request (#237). A push to an open PR starts a fresh run, and
# without a group the superseded one ran on for about half an hour on a head
# that could no longer merge. The key names this workflow, because every
# workflow in the repo shares one namespace of groups, and the pull request, so
# a push never cancels another PR's run. The number is empty on any event but a
# pull request, and an empty key would be one group for every such run, so a
# called run falls back to its own run id: a group of one, which cancels
# nothing (#163).
#
# Cancelling cannot starve the deploy: scripts/deploy-gate.mjs reads checks
# only off the head that MERGED, never a superseded one, and there it takes the
# latest run for each name, as branch protection does.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# What a job in this workflow is handed when it states nothing of its own.
# Without this line that is the REPOSITORY default, measured `write` on
# 2026-09-22 (`actions/permissions/workflow`) -- a value that lives in
# settings rather than in source, and can be widened again by a change no
# diff here would show. This workflow reads a checkout and runs a suite.
#
# Every job but `checks` inherits exactly this and needs nothing more; a list
# of them named here once already left out `functions` (#390). `checks` keeps
# its own block, because a job block REPLACES the inherited set rather than
# adding to it: dropping it would take `issues: read` with it and blind the
# dependabot-label step (#299). Every artifact upload is
# unaffected -- they authenticate with the runner's own runtime token, not this
# one, which is invisible on a green run and so was proved on a RED one (#301
# AC2) -- and so is build-and-test's download of this run's own artifacts.
#
# Changing the repository default is administration, and so the operator's.
# `tests/unit/pipeline-wiring.test.ts` derives this rule from the filesystem,
# so a workflow added later is covered the day it appears rather than the day
# someone remembers (#24, #49, #80).
permissions:
  contents: read

jobs:
  # Which Playwright image this run's browser jobs use (#454): the digest
  # docker/playwright/Dockerfile pins when it names the installed
  # @playwright/test, otherwise that version's, resolved now with a warning.
  # So a Playwright update is never red while Dependabot's image update
  # catches up, and every browser job in one run shares one digest.
  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - id: pick
        run: node scripts/playwright-image.mjs

  # Whether this pull request changes documentation and nothing else (#582).
  # A ledger or handover change ran all 14 jobs, about 15 minutes and 83
  # runner-minutes, while only `checks` could catch anything it does. On a
  # docs-only verdict the jobs that build or serve the site (the e2e shards,
  # sanity-on-build, functions) are skipped; `checks` always runs, and so does
  # `visual`, because it is required by name and the deploy gate refuses it
  # skipped (operator, 2026-10-06). Anything the script cannot place runs
  # everything, and build-and-test refuses a docs-only verdict unless the
  # jobs it skips were skipped and `checks` succeeded (scripts/e2e-shards.mjs).
  #
  # Depth 2: a pull request's checkout is GitHub's merge commit, and its first
  # parent is the base, so the diff between them is what the merge lands.
  scope:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.verdict.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - id: verdict
        run: node scripts/docs-only.mjs

  # Everything the merge gate ran before the e2e suite, in the same order, as a
  # job of its own so it runs BESIDE the shards rather than ahead of them. It
  # gates because build-and-test stands for it (#163). (This sat above `image`
  # from #454 until #390 F164.)
  checks:
    runs-on: ubuntu-26.04
    # Bounded, as every job is (#157); not the e2e policy, because this job
    # runs none of the e2e suite.
    timeout-minutes: 15
    # Narrowed from the repository default, which is `write` for any workflow
    # that states nothing (measured 2026-09-22 on
    # `actions/permissions/workflow`). This job reads a checkout and reads
    # this repository's labels, and writes nothing anywhere. Declaring ANY
    # permission sets every other one to none, so the checkout's `contents:
    # read` is restated beside it; labels live under the issues scope, which
    # is what `issues: read` buys. deploy-dev.yml's dispatch path calls this
    # workflow and must grant the same, since a called workflow's token can
    # only be narrowed (tests/unit/pipeline-wiring.test.ts).
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Every label `.github/dependabot.yml` asks for must exist, or Dependabot
      # drops it and posts a configuration-error comment in its place -- which
      # it did on every pull request from 2026-09-21 until #299. The claim is
      # about REPOSITORY STATE, so no unit test can judge it; it runs here
      # because build-and-test, the context branch protection requires, stands
      # for this job, and a job nothing required stands for would not be a gate
      # (#33).
      - name: Every label dependabot.yml names exists
        run: node scripts/dependabot-labels.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run format
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:unit

  # The e2e suite, split into parallel shards (#163). In one job it took 25.7
  # to 39.3 minutes (median 36.9, its last eight green runs) under a 45-minute
  # budget, and every pull request waited all of it.
  #
  # EIGHT, measured rather than guessed. Playwright hands each shard an equal
  # COUNT of tests in project order, so a shard is roughly one engine's slice,
  # and the engines differ about threefold per test. At four (run
  # 35830220134) chromium's shard took 4.9 minutes and the firefox-and-webkit
  # one 13.2, which is the wall-clock. Eight splits the slow slices.
  e2e:
    name: e2e shard ${{ matrix.shard }} of ${{ strategy.job-total }}
    needs: [image, scope]
    # Skipped on a docs-only pull request (#582); build-and-test then holds
    # that every shard was skipped rather than adding up accounts.
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-26.04
    # The e2e policy, restated per shard: tests/unit/pipeline-wiring.test.ts
    # pins it and fails if any job running the suite carries another.
    timeout-minutes: 20
    # The pinned Playwright image (#431): browsers and their system packages
    # come with it, so no step downloads them. A `playwright install` here
    # stalled on an apt mirror in run 36973026350 and spent the whole job.
    # The `image` job picks it: the digest docker/playwright/Dockerfile pins,
    # or the installed version's when that pin lags (#454). The job limit is
    # what bounds a stalled pull.
    container:
      image: ${{ needs.image.outputs.ref }}
      # Playwright's own advice for this runner: the runner's user, since
      # Firefox refuses root in another user's home, and the host's IPC
      # namespace, since Chromium outgrows a container's 64 MB /dev/shm.
      options: --user 1001 --ipc=host
    strategy:
      # A failing shard would otherwise CANCEL the others, and every test they
      # had not reached would go unreported. The gate is unaffected either
      # way: build-and-test refuses a cancelled shard as surely as a failed one.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # No build step, on purpose: the web server builds for the run, and the
      # unfiltered `--list` each shard is held to runs first, on a tree with
      # no `dist/`. That makes every shard prove collection needs no build
      # (#351); `pipeline-wiring.test.ts` refuses a build here.
      # The total is the matrix's own size, never a number written beside it,
      # so the two cannot disagree. Each shard enumerates the WHOLE suite and
      # writes down what it ran (scripts/test-e2e.mjs), for build-and-test to
      # add up.
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          E2E_ACCOUNT_DIR: e2e-accounts
      # Whatever the shard's outcome, and an empty upload is an ERROR: a shard
      # that wrote no account has nothing for build-and-test to add up.
      # `overwrite` because re-running a failed shard uploads its account
      # again, into a run that still holds the one it replaces.
      - name: Keep this shard's account for build-and-test
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-account-${{ matrix.shard }}
          path: e2e-accounts
          retention-days: 14
          overwrite: true
          if-no-files-found: error
      # Only when something failed, and only then. `actions/upload-artifact`
      # is first-party -- the same `actions` org as checkout and setup-node
      # above -- so this adds no new trust boundary, and it is SHA-pinned with
      # its version comment like every other action here. Named per shard,
      # because one run cannot hold two artifacts of one name (AC7).
      - name: Keep the failing shard's Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
          # `warn`, never `ignore`: `ignore` is the one value that lets this
          # step go GREEN having preserved nothing, and this step IS the
          # evidence path for a red run (#131).
          if-no-files-found: warn

  # The deployed-site suites, against this pull request's own build (#335).
  # tests/dev and tests/prod otherwise run only after a deploy, so a stale fact
  # in either went green here and failed the deploy after the merge (#330, run
  # 35948503612). `npm run test:sanity` builds this tree and previews it for
  # each config in turn, and leaves out the tests tagged @deployed-only, which
  # the deploy's own run still covers. It needs no credentials: nothing it
  # reaches is behind the dev site's Basic auth.
  sanity-on-build:
    needs: [image, scope]
    # Skipped on a docs-only pull request (#582).
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-26.04
    # 5 minutes: its last 12 green runs took at most 77 s (#431).
    timeout-minutes: 5
    # The pinned Playwright image (#431): browsers and their system packages
    # come with it, so no step downloads them. A `playwright install` here
    # stalled on an apt mirror in run 36973026350 and spent the whole job.
    # The `image` job picks it: the digest docker/playwright/Dockerfile pins,
    # or the installed version's when that pin lags (#454). The job limit is
    # what bounds a stalled pull.
    container:
      image: ${{ needs.image.outputs.ref }}
      # Playwright's own advice for this runner: the runner's user, since
      # Firefox refuses root in another user's home, and the host's IPC
      # namespace, since Chromium outgrows a container's 64 MB /dev/shm.
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Both sanity configs declare one project, chromium.
      - run: npm run test:sanity
      - name: Keep the failing run's Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}-sanity-on-build
          path: test-results/
          retention-days: 14
          # `warn`, never `ignore`, as for the shards above (#131).
          if-no-files-found: warn

  # The real Pages Functions on workerd (#97): `wrangler pages dev` serves
  # this tree's dist/ over a local D1 with the real migration applied, and a
  # browser submits real reports to it. build-and-test needs it, so it gates
  # with no change to branch protection.
  functions:
    needs: [image, scope]
    # Skipped on a docs-only pull request (#582).
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-26.04
    # 8 minutes: its last 12 green runs took at most 248 s (#431).
    timeout-minutes: 8
    # The pinned Playwright image (#431): browsers and their system packages
    # come with it, so no step downloads them. A `playwright install` here
    # stalled on an apt mirror in run 36973026350 and spent the whole job.
    # The `image` job picks it: the digest docker/playwright/Dockerfile pins,
    # or the installed version's when that pin lags (#454). The job limit is
    # what bounds a stalled pull.
    container:
      image: ${{ needs.image.outputs.ref }}
      # Playwright's own advice for this runner: the runner's user, since
      # Firefox refuses root in another user's home, and the host's IPC
      # namespace, since Chromium outgrows a container's 64 MB /dev/shm.
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:functions
      - name: Keep the failing run's Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}-functions
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  # THE REQUIRED CONTEXT. Branch protection requires it by name and
  # scripts/deploy-gate.mjs deploys because it passed, so it must go on meaning
  # what it meant when it ran the suite itself: every step ran, and the whole
  # suite ran. It runs none of that now. It stands for the jobs that do.
  build-and-test:
    needs: [image, scope, checks, e2e, sanity-on-build, functions]
    # NEVER skipped. A skipped required check is reported to branch protection
    # as passing, so an aggregate whose condition could turn false would read
    # green exactly when a shard failed or was skipped (#157). It runs always,
    # and refuses in the step below.
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # No shard ran on a docs-only pull request, so there is nothing to
      # collect (#582); the verdict below holds that none was written.
      - name: Collect every shard's account
        if: needs.scope.outputs.docs_only != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-account-*
          merge-multiple: true
          path: e2e-accounts
      # Every job it needs SUCCEEDED -- skipped and cancelled refused like
      # failure -- and the shards' accounts add up to the suite each of them
      # enumerated (scripts/e2e-shards.mjs). Run even when the download above
      # failed, so the refusal names what is missing. The verdict is handed
      # the glob's FILES and lists no directory: a glob matching nothing stays
      # the literal pattern, which it refuses by name. `needs` arrives as an
      # env var, never spliced into the script: it carries job outputs, and an
      # expression inside `run:` is code.
      - name: Every job succeeded, and the shards ran the whole suite
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/e2e-shards.mjs e2e-accounts/*.json

  # The visual-regression suite, in the SAME pinned image the baselines are
  # captured in (#33). Not a tidiness choice: a bare `ubuntu-latest` runner
  # and this image ship different font packages, and text rasterised by a
  # different font stack fails every screenshot for a reason that has nothing
  # to do with the site. Pinning both sides is what makes the comparison mean
  # anything.
  #
  # `image` tracks the `@playwright/test` version in package.json, and
  # `tests/unit/browser-matrix.test.ts` fails if the two drift apart -- a
  # library and a browser bundle from different releases is the one mismatch
  # this job cannot report clearly.
  #
  # It NEVER passes `--update-snapshots`. A CI run that can rewrite the
  # baseline it is checking against asserts nothing at all, which is the whole
  # failure class this repo keeps finding; `npm run test:visual:update` is the
  # only way a baseline changes, and it changes as a reviewable diff in a PR.
  visual:
    needs: image
    runs-on: ubuntu-26.04
    # Five minutes for a job whose last twelve green runs took at most 91 s
    # (measured 2026-10-02, #431): it bounds a stalled image pull, and a hung
    # browser is stopped long before the runner's 360-minute default (#157).
    timeout-minutes: 5
    container:
      image: ${{ needs.image.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Every baseline in this repo is captured on a laptop and compared HERE,
      # and until this printed nothing had ever confirmed the two render on the
      # same architecture (#224). The repo's claim that "both sides run the
      # same pinned image" holds for the image TAG; the tag is multi-arch. A
      # font rasterised on arm64 and compared against amd64 differs by pixels
      # nobody is looking at, and those pixels are spent out of the same
      # tolerance a real regression has to fit inside.
      - name: Record the rendering architecture
        env:
          IMAGE: ${{ needs.image.outputs.ref }}
        run: |
          arch=$(uname -m)
          echo "visual renders on: ${arch}"
          {
            echo "### Visual rendering architecture"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| \`uname -m\` | \`${arch}\` |"
            echo "| image | \`${IMAGE}\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - run: npx playwright test --project=visual
        env:
          VISUAL: '1'
      # The MEASUREMENT, never a gate (#224). The step above decides the
      # build; this one only reports how much of `threshold`'s allowance is
      # already spent by differences nobody is looking at -- a baseline
      # captured on another architecture, or before a CSS change. At
      # `threshold: 0` each such difference is reported with its own numbers
      # instead of being scored identical.
      #
      # `always()`, because a red gate is exactly when these numbers are worth
      # having; `continue-on-error`, because a zero-tolerance comparison is
      # EXPECTED to fail and must never decide a build.
      # `tee`, not `>>`: a step summary is rendered in the web UI and is NOT
      # exposed by the Actions API, so a table written only there cannot be
      # read back with `gh run view --log`. Measured the hard way on run
      # 35648992772 — the architecture came through because it was also echoed
      # to stdout, and the drift table did not (#224). Evidence in a medium it
      # cannot be read back from is evidence that is not there.
      - name: Measure baseline drift at zero tolerance
        if: always()
        continue-on-error: true
        env:
          VISUAL_MEASURE: '1'
        run: |
          npx playwright test --project=visual-measure --reporter=list \
            > measure.log 2>&1 || true
          {
            echo "### Baseline drift at zero per-pixel tolerance"
            echo
            echo "The gate runs at \`threshold: 0.1\` (a YIQ distance of ~352"
            echo "per pixel scores as identical) and \`maxDiffPixelRatio: 0\`."
            echo "Anything below is a difference the gate cannot see."
            echo
            echo '```'
            # The grep's OWN status decides the fallback. `||` tests the
            # PIPELINE's status, which is the last command's, and a `head`
            # between the two exits 0 whether or not grep matched -- so the
            # fallback was dead code and a run that measured nothing rendered
            # an empty block under a confident heading (#286).
            if drift=$(grep -E 'pixels .*are different|Error: |✘|passed|failed' measure.log); then
              # One line per comparison. The list reporter prints each ratio
              # once per attempt, and awk de-duplicates IN PLACE, so the table
              # keeps the order the run produced it in rather than sorting.
              # No cap: ten comparisons overflowed forty lines and the last
              # two were dropped with nothing in the output saying so.
              printf '%s\n' "$drift" | awk '!seen[$0]++'
            else
              echo 'no comparison output'
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # expected / actual / diff PNGs, which is the whole point: a visual
      # failure that can only be reproduced locally gets ignored. The gate's
      # images and the measurement's are in separate folders under
      # `test-results/`: the measure step's start deletes its own folder, and
      # while the two shared one it deleted the very diff this step exists to
      # keep (#311).
      - name: Keep the visual diff
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-diff-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          # `warn`, never `ignore`: `ignore` is the one value that lets this
          # step go GREEN having preserved nothing, and this step IS the
          # evidence path for a red run (#131).
          if-no-files-found: warn
