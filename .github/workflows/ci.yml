# PROBE for #913, never merged: Playwright's compile cache under NODE_V8_COVERAGE.
name: CI
on:
  workflow_dispatch:
permissions: {}
jobs:
  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - id: pick
        run: node scripts/playwright-image.mjs
  probe:
    needs: image
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: One spec on chromium, measured
        env:
          NODE_V8_COVERAGE: ${{ runner.temp }}/v8
          PWTEST_CACHE_DIR: ${{ runner.temp }}/pwcache
        run: npx playwright test --project=chromium tests/e2e/classroom-groups-projector.spec.ts --reporter=line
      - if: always()
        run: node scripts/probe-913.mjs "$RUNNER_TEMP/v8" "$RUNNER_TEMP/pwcache"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-913
          path: |
            ${{ runner.temp }}/v8
            ${{ runner.temp }}/pwcache
          retention-days: 3
